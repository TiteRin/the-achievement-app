# Explicit project name so this stack's volumes/network/containers never
# collide with docker-compose.yml's (the dev-only Postgres) when both are
# run on the same host — they'd otherwise both default to the directory
# name and silently share the same Postgres data volume.
name: myachievements-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myachievements}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-myachievements}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myachievements}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: applies pending migrations, then exits. `app` waits for it
  # to succeed before starting (see depends_on below).
  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-myachievements}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-myachievements}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-myachievements}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-myachievements}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      # Required for Auth.js v5 self-hosted behind a reverse proxy / non-Vercel
      # host — without it, every request is rejected as UntrustedHost.
      AUTH_TRUST_HOST: "true"
      # Comma-separated emails auto-promoted to admin on next login. Optional
      # — the app keeps working with none configured (falls back to the
      # manual `UPDATE users SET role = 'admin' ...` path).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # SMTP for magic-link sign-in emails. Optional — password login keeps
      # working without it; magic-link requests just fail to send.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-The Achievement App <no-reply@example.com>}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
